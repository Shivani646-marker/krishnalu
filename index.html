<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="description" content="Krishnalu – A divine spiritual experience inspired by Lord Krishna and the Bhagavad Gita"/>
<title>Krishnalu – Enter Krishna's Divine World</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Marcellus&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   KRISHNALU — Divine Spiritual Experience
   Inspired by Lord Krishna & the Bhagavad Gita
   ============================================================ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  color-scheme: dark;
  --royal-blue: #020818;
  --deep-blue: #050d2e;
  --mid-blue: #0a1a5c;
  --cyan: #00d4ff;
  --peacock: #00b4d8;
  --gold: #f5c518;
  --gold-light: #ffd700;
  --gold-dim: #c9a227;
  --white: #f0f4ff;
  --mist: #c8d8ff;
  --purple: #7c3aed;
  --pink: #ec4899;
  --lavender: #a78bfa;
}

html, body {
  width: 100%; min-height: 100vh;
  min-height: 100dvh;
  background: #020818;
  color: var(--white);
  overflow-x: hidden;
  scroll-behavior: smooth;
}

/* ─── UNIVERSE BACKGROUND ─── */
#universe {
  position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
  background: radial-gradient(ellipse 80% 60% at 50% 20%, #0a1a6e 0%, #020818 55%, #000510 100%);
  transition: transform 0.1s ease-out;
}

.moon {
  position: absolute; top: -60px; right: 8%;
  width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,220,.20) 0%, rgba(200,210,255,.08) 45%, transparent 70%);
  animation: moonpulse 9s ease-in-out infinite;
}
@keyframes moonpulse {
  0%,100% { transform: scale(1); opacity: .7; }
  50% { transform: scale(1.1); opacity: 1; }
}

.star {
  position: absolute; border-radius: 50%; background: #fff;
  animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
}
@keyframes twinkle {
  0% { opacity: .1; transform: scale(1); }
  100% { opacity: .95; transform: scale(1.6); }
}

.cloud {
  position: absolute; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(100,130,255,.07) 0%, transparent 70%);
  animation: drift var(--dt, 40s) linear infinite;
}
@keyframes drift {
  0% { transform: translateX(-120px); }
  100% { transform: translateX(140px); }
}

.silhouette {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 260px; height: 500px; opacity: .18; filter: blur(3px);
  background:
    radial-gradient(ellipse 60px 70px at 130px 80px, rgba(80,40,200,.6) 0%, transparent 70%),
    radial-gradient(ellipse 80px 180px at 130px 220px, rgba(60,30,180,.4) 0%, transparent 70%),
    radial-gradient(ellipse 110px 200px at 130px 380px, rgba(50,20,150,.3) 0%, transparent 70%);
}

.particle {
  position: absolute; border-radius: 50%;
  width: var(--sz, 3px); height: var(--sz, 3px);
  background: var(--col, #f5c518);
  animation: floatP var(--ft, 10s) ease-in-out infinite;
}
@keyframes floatP {
  0% { transform: translateY(0) translateX(0) scale(1); opacity: .7; }
  33% { transform: translateY(-70px) translateX(25px) scale(1.4); opacity: .9; }
  66% { transform: translateY(-35px) translateX(-18px) scale(.7); opacity: .4; }
  100% { transform: translateY(0) translateX(0) scale(1); opacity: .7; }
}

.lotus-petal {
  position: absolute; width: 16px; height: 26px;
  border-radius: 50% 50% 30% 30%;
  background: linear-gradient(135deg, rgba(236,72,153,.4), rgba(167,139,250,.25));
  animation: lotusFloat var(--lf, 15s) ease-in-out infinite;
  transform-origin: bottom center; filter: blur(.8px);
}
@keyframes lotusFloat {
  0% { transform: translateY(0) rotate(var(--lr, 0deg)); opacity: .5; }
  50% { transform: translateY(-50px) rotate(calc(var(--lr, 0deg) + 25deg)); opacity: .8; }
  100% { transform: translateY(0) rotate(var(--lr, 0deg)); opacity: .5; }
}

/* ─── LAYOUT ─── */
#app { position: relative; z-index: 1; min-height: 100vh; }

.page {
  min-height: 100vh; min-height: 100dvh; width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 24px 40px;
  opacity: 0; transition: opacity .6s ease;
}
.page.visible { opacity: 1; }
.page.hidden { display: none !important; }

/* ─── FIXED CONTROLS ─── */
.mute-btn {
  position: fixed;
  top: max(16px, env(safe-area-inset-top, 16px));
  right: max(16px, env(safe-area-inset-right, 16px));
  z-index: 1000;
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(5,13,46,.75); backdrop-filter: blur(14px);
  border: 1px solid rgba(200,216,255,.22);
  color: var(--mist); font-size: 1.3rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .3s; box-shadow: 0 0 20px rgba(0,0,0,.4);
}
.mute-btn:hover { background: rgba(100,130,255,.22); border-color: var(--peacock); }

.back-btn {
  position: fixed;
  top: max(16px, env(safe-area-inset-top, 16px));
  left: max(16px, env(safe-area-inset-left, 16px));
  z-index: 1000;
  min-height: 44px;
  font-family: 'Cinzel', serif; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--mist); border: 1px solid rgba(200,216,255,.22);
  background: rgba(5,13,46,.75); backdrop-filter: blur(14px);
  padding: 12px 22px; border-radius: 30px; cursor: pointer;
  transition: all .3s; box-shadow: 0 0 20px rgba(0,0,0,.4);
  display: none;
}
.back-btn:hover { background: rgba(100,130,255,.22); border-color: var(--cyan); color: var(--cyan); }
.back-btn.visible { display: inline-flex; align-items: center; justify-content: center; }

/* ─── HOME PAGE ─── */
.home-inner {
  display: flex; flex-direction: column; align-items: center;
  gap: 20px; width: 100%; max-width: 860px;
}

.feather-svg {
  filter: drop-shadow(0 0 22px #00d4ff) drop-shadow(0 0 8px #a78bfa);
  animation: featherSway 6s ease-in-out infinite;
}
@keyframes featherSway {
  0%,100% { transform: rotate(-4deg) scale(1); }
  50% { transform: rotate(4deg) scale(1.05); }
}

.om-symbol {
  font-size: 2.2rem; color: var(--gold);
  text-shadow: 0 0 40px var(--gold), 0 0 80px rgba(245,197,24,.4);
  animation: omPulse 5s ease-in-out infinite; display: block; text-align: center;
}
@keyframes omPulse {
  0%,100% { text-shadow: 0 0 30px var(--gold), 0 0 60px rgba(245,197,24,.3); transform: scale(1); }
  50% { text-shadow: 0 0 60px var(--gold), 0 0 120px rgba(245,197,24,.6); transform: scale(1.08); }
}

.brand-title {
  font-family: 'Cinzel', serif; font-weight: 900;
  font-size: clamp(3.5rem, 10vw, 7rem);
  background: linear-gradient(135deg, #ffd700 0%, #f5c518 25%, #00d4ff 58%, #a78bfa 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  letter-spacing: .14em; line-height: 1; text-align: center;
  filter: drop-shadow(0 0 50px rgba(245,197,24,.45));
  animation: titleGlow 5s ease-in-out infinite alternate;
}
@keyframes titleGlow {
  0% { filter: drop-shadow(0 0 35px rgba(245,197,24,.4)); }
  100% { filter: drop-shadow(0 0 70px rgba(0,212,255,.65)); }
}

.divider {
  width: 200px; height: 1px; margin: 4px auto;
  background: linear-gradient(90deg, transparent, var(--gold-dim), var(--peacock), var(--gold-dim), transparent);
  box-shadow: 0 0 14px var(--gold-dim);
}

.tagline {
  font-family: 'Playfair Display', serif; font-style: italic;
  font-size: clamp(1rem, 2.8vw, 1.4rem);
  color: var(--mist); letter-spacing: .04em; text-align: center;
  text-shadow: 0 0 30px rgba(168,139,250,.5);
}

.choose-label {
  font-family: 'Marcellus', serif; font-size: clamp(.75rem, 1.8vw, .95rem);
  color: rgba(200,216,255,.72); letter-spacing: .22em; text-transform: uppercase;
}

/* ─── MOOD GRID ─── */
.mood-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 14px; width: 100%; max-width: 820px;
}

.mood-card {
  position: relative; border-radius: 20px;
  padding: 26px 14px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  cursor: pointer; overflow: hidden;
  border: 1px solid rgba(255,255,255,.1);
  backdrop-filter: blur(20px);
  background: rgba(255,255,255,.04);
  transition: transform .35s cubic-bezier(.22,.61,.36,1), box-shadow .35s ease, border-color .35s ease;
  animation: cardIn .6s ease both;
  user-select: none;
}
.mood-card::before {
  content: ''; position: absolute; inset: 0; border-radius: 20px;
  background: var(--cg); opacity: .14; transition: opacity .3s;
}
.mood-card:hover { transform: translateY(-10px) scale(1.05); border-color: rgba(255,255,255,.28); }
.mood-card:hover::before { opacity: .32; }
.mood-card:active { transform: translateY(-4px) scale(1.01); }

.card-glow {
  position: absolute; inset: -1px; border-radius: 21px; opacity: 0;
  background: var(--cg); filter: blur(18px); z-index: -1; transition: opacity .35s;
}
.mood-card:hover .card-glow { opacity: .45; }

.mood-icon { font-size: 2.4rem; display: block; transition: transform .35s; line-height: 1; }
.mood-card:hover .mood-icon { transform: scale(1.25) rotate(-6deg); }

.mood-label {
  font-family: 'Cinzel', serif; font-size: .72rem;
  letter-spacing: .14em; text-transform: uppercase; color: var(--mist); font-weight: 600;
}

.mood-shine {
  position: absolute; top: 0; left: -100%; width: 60%; height: 100%;
  background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.08) 50%, transparent 60%);
  transition: left .5s ease;
}
.mood-card:hover .mood-shine { left: 150%; }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(28px) scale(.93); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ─── QUOTE PAGE ─── */
.quote-inner {
  display: flex; flex-direction: column; align-items: center;
  gap: 28px; width: 100%; max-width: 720px;
}

.mood-badge-display {
  font-family: 'Marcellus', serif; font-size: .9rem;
  letter-spacing: .22em; text-transform: uppercase;
  color: rgba(200,216,255,.72);
}

/* Quote card */
.quote-card {
  position: relative; width: 100%;
  background: rgba(8,20,80,.38); backdrop-filter: blur(28px);
  border-radius: 32px; padding: 56px 48px 48px;
  border: 1px solid rgba(255,255,255,.11);
  box-shadow:
    0 0 100px rgba(0,212,255,.08),
    0 0 50px rgba(124,58,237,.1),
    inset 0 1px 0 rgba(255,255,255,.08);
  text-align: center;
  animation: quoteIn .9s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes quoteIn {
  from { opacity: 0; transform: scale(.9) translateY(36px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* Peacock corners */
.q-corner { position: absolute; width: 64px; height: 64px; opacity: .65; pointer-events: none; }
.q-corner.tl { top: 14px; left: 14px; }
.q-corner.tr { top: 14px; right: 14px; transform: scaleX(-1); }
.q-corner.bl { bottom: 14px; left: 14px; transform: scaleY(-1); }
.q-corner.br { bottom: 14px; right: 14px; transform: scale(-1); }

.quote-mood-icon {
  font-size: 3.2rem; display: block; margin-bottom: 18px;
  animation: iconPulse 3.5s ease-in-out infinite;
}
@keyframes iconPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

.q-parth {
  font-family: 'Cinzel', serif; font-size: clamp(1.05rem, 2.5vw, 1.4rem);
  color: var(--gold); letter-spacing: .08em; margin-bottom: 20px;
  text-shadow: 0 0 40px rgba(245,197,24,.7);
  animation: parthGlow 4s ease-in-out infinite alternate;
}
@keyframes parthGlow {
  0% { text-shadow: 0 0 30px rgba(245,197,24,.5); }
  100% { text-shadow: 0 0 60px rgba(245,197,24,.9), 0 0 100px rgba(245,197,24,.3); }
}

.q-text {
  font-family: 'Playfair Display', serif; font-style: italic;
  font-size: clamp(1rem, 2.5vw, 1.28rem); line-height: 1.9;
  color: var(--white); text-shadow: 0 0 25px rgba(168,139,250,.2);
  margin-bottom: 28px;
}

.q-attribution {
  font-family: 'Marcellus', serif; font-size: .82rem;
  letter-spacing: .18em; color: rgba(200,216,255,.72); text-transform: uppercase;
}
.q-ref {
  font-family: 'Cinzel', serif; font-size: .7rem;
  letter-spacing: .12em; color: var(--gold-dim); margin-top: 8px; opacity: .85;
}

.sparkle {
  position: absolute; border-radius: 50%; background: var(--gold-light);
  box-shadow: 0 0 8px var(--gold);
  animation: sparkleAnim var(--ss, 3s) ease-in-out infinite;
  pointer-events: none;
}
@keyframes sparkleAnim {
  0%,100% { opacity: 0; transform: scale(0) translateY(0); }
  50% { opacity: 1; transform: scale(1) translateY(-24px); }
}

.aura-ring {
  position: absolute; inset: -20px; border-radius: 48px;
  background: transparent;
  box-shadow: 0 0 60px rgba(0,212,255,.07), 0 0 120px rgba(124,58,237,.06);
  animation: auraBreath 6s ease-in-out infinite;
  pointer-events: none;
}
@keyframes auraBreath {
  0%,100% { box-shadow: 0 0 60px rgba(0,212,255,.07), 0 0 120px rgba(124,58,237,.06); }
  50% { box-shadow: 0 0 100px rgba(0,212,255,.14), 0 0 200px rgba(124,58,237,.1); }
}

/* Buttons */
.btn-next {
  position: relative;
  z-index: 50;
  font-family: 'Cinzel', serif; font-size: .82rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--cyan); border: 1px solid rgba(0,212,255,.38);
  background: rgba(0,212,255,.08); backdrop-filter: blur(14px);
  padding: 16px 36px; border-radius: 40px; cursor: pointer;
  transition: all .35s; margin-top: 4px;
  user-select: none;
}
.btn-next:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}
.btn-next:hover {
  background: rgba(0,212,255,.2); border-color: var(--cyan);
  box-shadow: 0 0 40px rgba(0,212,255,.3);
  transform: translateY(-2px);
}

/* ─── TRANSITION OVERLAY ─── */
#transitionOverlay {
  position: fixed; inset: 0; z-index: 9000;
  background: radial-gradient(ellipse at center, rgba(10,26,100,.97) 0%, rgba(2,8,24,.99) 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  opacity: 0; pointer-events: none;
  transition: opacity .4s ease;
}
#transitionOverlay.active { opacity: 1; pointer-events: all; }
#transitionOverlay .t-om {
  font-size: 4.5rem; color: var(--gold);
  text-shadow: 0 0 80px var(--gold), 0 0 160px rgba(245,197,24,.4);
  animation: omPulse 1.2s ease-in-out infinite;
}
#transitionOverlay .t-label {
  font-family: 'Marcellus', serif; font-size: .9rem;
  letter-spacing: .25em; color: rgba(200,216,255,.5); text-transform: uppercase;
}
.t-particle {
  position: absolute; width: 3px; height: 3px; border-radius: 50%;
  background: var(--gold-light); box-shadow: 0 0 8px var(--gold);
  animation: tpFloat 1s ease-out forwards;
}
@keyframes tpFloat {
  0% { opacity: 1; transform: translate(0,0) scale(1.5); }
  100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
}

/* ─── RESPONSIVE ─── */
@media (max-width: 600px) {
  .page {
    padding-top: max(80px, calc(env(safe-area-inset-top, 0px) + 72px));
    padding-bottom: max(40px, env(safe-area-inset-bottom, 40px));
    padding-left: max(16px, env(safe-area-inset-left, 16px));
    padding-right: max(16px, env(safe-area-inset-right, 16px));
  }
  .brand-title {
    font-size: clamp(2.3rem, 11vw, 3.4rem);
    letter-spacing: .08em;
  }
  .mood-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .mood-card { padding: 18px 8px 14px; }
  .mood-icon { font-size: 1.9rem; }
  .quote-card { padding: 44px 20px 36px; }
  .q-corner { width: 44px; height: 44px; }
}
@media (max-width: 380px) {
  .mood-grid { grid-template-columns: repeat(2, 1fr); }
  .quote-card { padding: 40px 16px 32px; }
  .q-corner { width: 36px; height: 36px; }
}
}

/* ================================================================
   LANDING PAGE — Two-Column Hero Layout
   Design principles:
   • Left 40%: deep dark panel — OM, title, divider, greeting, CTA
     All content vertically centered, left-aligned on desktop
   • Right 60%: Krishna photo fills column edge-to-edge
   • Edge gradient blends photo into left panel
   • Tablet portrait: stacks — image 55vh top, text 45vh bottom
   • Mobile: same stack, centered text
   • Landscape phone: side-by-side, compressed
   ================================================================ */

/* ── Page shell ── */
#landingPage {
  position: fixed;
  inset: 0;
  z-index: 500;
  display: flex;
  flex-direction: row;
  background: #050210;
  overflow: hidden;
}

/* ═══════════════════════════════
   LEFT COLUMN  — 40 %
═══════════════════════════════ */
.landing-left {
  flex: 0 0 40%;
  min-width: 0;
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  /* Horizontal rhythm: generous left margin, comfortable right padding */
  padding-left:  clamp(32px, 5vw, 80px);
  padding-right: clamp(24px, 3vw, 56px);
  padding-top:    40px;
  padding-bottom: 40px;
  /* Solid-to-transparent gradient so text always reads against dark */
  background: linear-gradient(
    to right,
    rgba(5,2,18,1.00)  0%,
    rgba(5,2,18,0.98) 60%,
    rgba(5,2,18,0.80) 82%,
    rgba(5,2,18,0.00) 100%
  );
}

/* OM symbol — small, above title */
.landing-om {
  font-size: clamp(1.4rem, 2.2vw, 2rem);
  color: var(--gold);
  text-shadow: 0 0 24px var(--gold), 0 0 52px rgba(245,197,24,.35);
  animation: omPulse 5s ease-in-out infinite;
  display: block;
  /* Space between OM and title */
  margin-bottom: clamp(10px, 1.6vh, 18px);
  line-height: 1;
}

/* Brand title */
.landing-title {
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: clamp(2.6rem, 4.8vw, 5.2rem);
  background: linear-gradient(
    135deg,
    #ffd700 0%, #f9e265 20%,
    #fffbe6 44%, #00d4ff 66%,
    #a78bfa 100%
  );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: .13em;
  line-height: 1;
  /* Crisp shadow even through transparent text */
  filter: drop-shadow(0 0 32px rgba(245,197,24,.55))
          drop-shadow(0 3px 14px rgba(0,0,0,.85));
  animation: titleGlow 5s ease-in-out infinite alternate;
  /* Space below title → divider */
  margin-bottom: clamp(8px, 1.2vh, 14px);
  white-space: nowrap;
}

/* Thin gold accent rule */
.landing-divider {
  width: clamp(72px, 10vw, 140px);
  height: 1px;
  /* Space: top (touches title) + bottom (before greeting) */
  margin: 0 0 clamp(16px, 2.4vh, 26px);
  background: linear-gradient(
    90deg,
    var(--gold-dim), #f0d060, var(--gold-dim), transparent
  );
  box-shadow: 0 0 10px rgba(201,162,39,.85);
}

/* Greeting / tagline */
.landing-greeting {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: clamp(.9rem, 1.6vw, 1.18rem);
  color: rgba(238,234,255,.94);
  text-shadow:
    0 0 18px rgba(168,139,250,.45),
    0 2px 10px rgba(0,0,0,.88);
  line-height: 1.82;
  /* Prevent runaway width on ultra-wide screens */
  max-width: 34ch;
  /* Space below greeting → button */
  margin: 0 0 clamp(28px, 4.2vh, 46px);
  letter-spacing: .016em;
  animation: fadeSlideUp 1.3s ease both;
  animation-delay: .5s;
  opacity: 0;
}
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* YES button */
.btn-yes {
  position: relative;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  /* Typography */
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: clamp(.8rem, 1.3vw, 1rem);
  letter-spacing: .28em;
  text-transform: uppercase;
  color: #08040f;
  /* Background */
  background: linear-gradient(135deg, #ffe44d 0%, #f5c518 48%, #ffd700 100%);
  border: none;
  border-radius: 60px;
  /* Padding — generous horizontal, comfortable vertical */
  padding: clamp(12px, 1.6vw, 16px) clamp(36px, 5.5vw, 68px);
  cursor: pointer;
  outline: none;
  /* Left-align with text above it */
  align-self: flex-start;
  /* Glow shadow */
  box-shadow:
    0 0 30px rgba(245,197,24,.65),
    0 0 60px rgba(245,197,24,.30),
    0 4px 18px rgba(0,0,0,.62),
    inset 0 1px 0 rgba(255,255,255,.52);
  transition:
    transform  .32s cubic-bezier(.22,.61,.36,1),
    box-shadow .32s ease;
  animation: fadeSlideUp 1.3s ease both, yesGlow 3s ease-in-out infinite;
  animation-delay: .9s, 1.2s;
  opacity: 0;
  -webkit-tap-highlight-color: transparent;
}
/* Shimmer sweep */
.btn-yes::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 60px;
  background: linear-gradient(
    105deg,
    transparent 28%,
    rgba(255,255,255,.38) 50%,
    transparent 72%
  );
  transform: translateX(-130%);
  transition: transform .65s ease;
}
.btn-yes:hover::before { transform: translateX(130%); }
.btn-yes:hover {
  transform: translateY(-5px) scale(1.06);
  box-shadow:
    0 0 58px rgba(245,197,24,.88),
    0 0 116px rgba(245,197,24,.44),
    0 8px 28px rgba(0,0,0,.66);
}
.btn-yes:active { transform: translateY(-2px) scale(1.02); }
@keyframes yesGlow {
  0%,100% {
    box-shadow:
      0 0 30px rgba(245,197,24,.65),
      0 0 60px rgba(245,197,24,.30),
      0 4px 18px rgba(0,0,0,.62);
  }
  50% {
    box-shadow:
      0 0 58px rgba(245,197,24,.92),
      0 0 116px rgba(245,197,24,.50),
      0 4px 18px rgba(0,0,0,.62);
  }
}

/* ═══════════════════════════════
   RIGHT COLUMN — 60 %
═══════════════════════════════ */
.landing-right {
  flex: 1 1 0;
  min-width: 0;
  position: relative;
  overflow: hidden;
}

/* Krishna image — fills the column exactly */
.krishna-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  /* Show face (upper third of portrait) + outstretched hand (lower-right) */
  object-position: 38% 10%;
  filter: brightness(.9) saturate(1.14) contrast(1.04);
  animation: krishnaReveal 2.2s cubic-bezier(.22,.61,.36,1) both;
  will-change: transform, opacity;
}
@keyframes krishnaReveal {
  0%   {
    opacity: 0;
    transform: scale(1.05);
    filter: brightness(.35) saturate(.5);
  }
  55%  { opacity: 1; }
  100% {
    opacity: 1;
    transform: scale(1);
    filter: brightness(.9) saturate(1.14) contrast(1.04);
  }
}

/* Left-edge gradient: blends photo into the dark left panel */
.landing-right-fade {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 110px;
  z-index: 2;
  pointer-events: none;
  background: linear-gradient(
    to right,
    rgba(5,2,18,1.00)  0%,
    rgba(5,2,18,.30)  50%,
    transparent        100%
  );
}

/* Bottom edge: gently grounds the image */
.landing-bottom-fade {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 20%;
  z-index: 2;
  pointer-events: none;
  background: linear-gradient(
    to top,
    rgba(5,2,18,.55) 0%,
    transparent       100%
  );
}

/* Divine golden halo — centred on Krishna's figure */
.krishna-aura {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(
    ellipse 65% 55% at 42% 36%,
    rgba(255,206,68,.15)  0%,
    rgba(245,155,38,.06) 38%,
    transparent           68%
  );
  animation: auraBreath 7s ease-in-out infinite;
}

/* Hand glow — bottom-right where the outstretched hand reaches */
.krishna-hand-glow {
  position: absolute;
  bottom: 0; right: 0;
  width: 72%; height: 42%;
  z-index: 2;
  pointer-events: none;
  background: radial-gradient(
    ellipse 68% 62% at 76% 80%,
    rgba(245,197,24,.22)  0%,
    rgba(255,160,0,.07)   42%,
    transparent            72%
  );
  animation: handGlow 5s ease-in-out infinite;
}
@keyframes handGlow {
  0%,100% { opacity: .6; }
  50%     { opacity: 1; }
}

/* Floating golden dust particles */
.land-dust {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  z-index: 3;
  background: var(--gold-light);
  box-shadow: 0 0 6px var(--gold);
  animation: dustRise var(--dr, 12s) ease-in-out infinite;
}
@keyframes dustRise {
  0%   { transform: translateY(0) translateX(0) scale(1.2); opacity: 0; }
  12%  { opacity: .75; }
  88%  { opacity: .32; }
  100% { transform: translateY(-90vh) translateX(var(--dx, 20px)) scale(.12); opacity: 0; }
}

/* ═══════════════════════════════
   TABLET  (portrait, ≤ 900 px)
   Keep two columns but compress
═══════════════════════════════ */
@media (max-width: 900px) and (orientation: portrait) {
  #landingPage { flex-direction: column; }

  /* Image: top 56% of screen height */
  .landing-right {
    flex: 0 0 56%;
    min-height: 56%;
  }
  .krishna-photo   { object-position: 45% 8%; }
  .landing-right-fade {
    width: 0;                     /* no side fade on stacked layout */
  }
  .landing-bottom-fade {
    height: 30%;
    background: linear-gradient(
      to top,
      rgba(5,2,18,.92) 0%,
      rgba(5,2,18,.45) 45%,
      transparent       80%
    );
  }

  /* Text: remaining 44% */
  .landing-left {
    flex: 1 1 0;
    /* Centre everything on mobile */
    align-items: center;
    text-align: center;
    justify-content: center;
    padding-left:  clamp(20px, 6vw, 40px);
    padding-right: clamp(20px, 6vw, 40px);
    padding-top:   clamp(18px, 3vh, 32px);
    padding-bottom: clamp(24px, 5vh, 48px);
    background: linear-gradient(
      to bottom,
      rgba(5,2,18,0)   0%,
      rgba(5,2,18,1)  10%,
      rgba(5,2,18,1) 100%
    );
  }
  .landing-om {
    font-size: clamp(1.2rem, 5vw, 1.7rem);
    margin-bottom: clamp(6px, 1.2vh, 10px);
  }
  .landing-title {
    font-size: clamp(2.2rem, 9.5vw, 3.6rem);
    letter-spacing: .1em;
    white-space: normal;
    text-align: center;
    margin-bottom: clamp(4px, .8vh, 8px);
  }
  .landing-divider {
    margin: 0 auto clamp(10px, 1.8vh, 18px);
  }
  .landing-greeting {
    font-size: clamp(.87rem, 3.4vw, 1.06rem);
    text-align: center;
    max-width: 38ch;
    margin: 0 auto clamp(18px, 3.2vh, 32px);
  }
  .btn-yes {
    align-self: center;
    font-size: clamp(.8rem, 3vw, .96rem);
    padding: clamp(12px, 2.5vw, 15px) clamp(34px, 9vw, 58px);
  }
}

/* ═══════════════════════════════
   LANDSCAPE PHONE  (height ≤ 500)
   Ultra-compact two-column
═══════════════════════════════ */
@media (orientation: landscape) and (max-height: 500px) {
  .landing-left {
    flex: 0 0 46%;
    padding-left:  clamp(18px, 2.8vw, 32px);
    padding-right: clamp(14px, 2vw, 24px);
    padding-top: 16px;
    padding-bottom: 16px;
  }
  .landing-om { display: none; }
  .landing-title {
    font-size: clamp(1.7rem, 4.2vw, 2.6rem);
    margin-bottom: 4px;
  }
  .landing-divider {
    margin-bottom: clamp(7px, 1.4vh, 12px);
  }
  .landing-greeting {
    font-size: clamp(.78rem, 1.5vw, .96rem);
    margin-bottom: clamp(12px, 2.4vh, 22px);
    max-width: 30ch;
  }
  .btn-yes {
    padding: clamp(9px, 1.4vw, 13px) clamp(26px, 4.5vw, 48px);
    font-size: clamp(.76rem, 1.2vw, .92rem);
  }
}

/* ═══════════════════════════════
   LARGE / 4 K screens
═══════════════════════════════ */
@media (min-width: 1600px) {
  .krishna-photo { object-position: 38% 6%; }
  .landing-left {
    padding-left:  clamp(80px, 5.5vw, 120px);
    padding-right: clamp(60px, 4vw,  90px);
  }
}

/* Dynamic text fade animation */
.q-dynamic-text {
  transition: opacity 0.3s ease, transform 0.3s ease;
  will-change: opacity, transform;
}
.q-dynamic-text.fading {
  opacity: 0 !important;
  transform: translateY(8px) scale(0.98);
}

</style>
</head>

let currentMood = null;

let muted = false;
let audioCtx = null;
let isTransitioningMessage = false;

// ================================================================
// SHUFFLE-BAG ALGORITHM WITH LOCALSTORAGE (NO REPETITION)
// ================================================================
function getShuffleBag(moodId, totalCount) {
  const storageKey = `krishnalu_bag_${moodId}`;
  try {
    const raw = localStorage.getItem(storageKey);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.unseen) && typeof parsed.lastShown !== 'undefined') {
        return parsed;
      }
    }
  } catch (e) {}
  return { unseen: [], lastShown: null };
}

function saveShuffleBag(moodId, bagState) {
  const storageKey = `krishnalu_bag_${moodId}`;
  try {
    localStorage.setItem(storageKey, JSON.stringify(bagState));
  } catch (e) {}
}

function createShuffledIndices(count, avoidFirst) {
  const arr = [];
  for (let i = 0; i < count; i++) arr.push(i);
  // Fisher-Yates shuffle
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = arr[i];
    arr[i] = arr[j];
    arr[j] = temp;
  }
  // When reshuffling, make sure the first message of the new round is never the same as the last one shown
  if (count > 1 && avoidFirst !== null && arr[0] === avoidFirst) {
    const swapIdx = 1 + Math.floor(Math.random() * (count - 1));
    const temp = arr[0];
    arr[0] = arr[swapIdx];
    arr[swapIdx] = temp;
  }
  return arr;
}

function getNextMoodMessage(mood) {
  const count = mood.messages.length;
  let bagState = getShuffleBag(mood.id, count);

  // If bag is empty or depleted, reshuffle full pool
  if (!bagState.unseen || bagState.unseen.length === 0) {
    bagState.unseen = createShuffledIndices(count, bagState.lastShown);
  }

  // Double check: Never show the same message twice in a row, even if pool has 1 leftover
  if (count > 1 && bagState.lastShown !== null && bagState.unseen[0] === bagState.lastShown) {
    if (bagState.unseen.length > 1) {
      const temp = bagState.unseen[0];
      bagState.unseen[0] = bagState.unseen[1];
      bagState.unseen[1] = temp;
    } else {
      bagState.unseen = createShuffledIndices(count, bagState.lastShown);
    }
  }

  const nextIdx = bagState.unseen.shift();
  bagState.lastShown = nextIdx;
  saveShuffleBag(mood.id, bagState);

  return { msg: mood.messages[nextIdx], idx: nextIdx };
}

// ================================================================
// AUDIO
// ================================================================
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playFlute() {
  if (muted) return;
  try {
    const ctx = getCtx();
    const notes = [261.6, 329.6, 392, 440, 523.3, 440, 392, 329.6, 261.6, 220];
    let t = ctx.currentTime + 0.05;
    notes.forEach((freq, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t + i * .22);
      g.gain.linearRampToValueAtTime(.055, t + i * .22 + .05);
      g.gain.exponentialRampToValueAtTime(.0001, t + i * .22 + .45);
      o.start(t + i * .22); o.stop(t + i * .22 + .5);
    });
  } catch(e) {}
}

function playChime() {
  if (muted) return;
  try {
    const ctx = getCtx();
    [880, 1108, 1320, 1760].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = f;
      const t = ctx.currentTime + i * .14;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.038, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + 1.4);
      o.start(t); o.stop(t + 1.5);
    });
  } catch(e) {}
}

  // Stars
  for (let i = 0; i < 220; i++) {

      --d:${1.5+Math.random()*5}s;animation-delay:${Math.random()*5}s`;

  // Clouds
  for (let i = 0; i < 5; i++) {
    const c = document.createElement('div');
    c.className = 'cloud';
    c.style.cssText = `width:${180+Math.random()*260}px;height:${70+Math.random()*100}px;
      left:${Math.random()*80}%;top:${Math.random()*55}%;
      --dt:${28+Math.random()*35}s;animation-delay:${Math.random()*18}s`;
    u.appendChild(c);

  // Silhouette

  u.appendChild(sil);

  // Particles
  const pcols = ['#f5c518','#ffd700','#00d4ff','#a78bfa','#ec4899','#fff','#38bdf8'];
  for (let i = 0; i < 80; i++) {
    const p = document.createElement('div');

    const sz = Math.random() * 4.5 + .8;
    p.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;
      --sz:${sz}px;--col:${col};--ft:${7+Math.random()*14}s;
      animation-delay:${Math.random()*12}s;opacity:${Math.random()*.5+.15}`;
    u.appendChild(p);
  }

  // Lotus petals
  for (let i = 0; i < 28; i++) {
    const l = document.createElement('div');
    l.className = 'lotus-petal';
    const r = Math.random() * 360;
    l.style.cssText = `left:${Math.random()*100}%;top:${55+Math.random()*45}%;
      --lf:${9+Math.random()*16}s;--lr:${r}deg;
      animation-delay:${Math.random()*10}s`;
    u.appendChild(l);
  }
}

// ================================================================
function buildMoodGrid() {
  const grid = document.getElementById('moodGrid');
  grid.innerHTML = '';
  MOODS.forEach((mood, i) => {
    const card = document.createElement('div');
    card.className = 'mood-card';
    card.style.setProperty('--cg', mood.gradient);
    card.style.animationDelay = `${i * .075}s`;
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-label', `Select emotion ${mood.label}`);
    card.innerHTML = `
      <div class="card-glow"></div>
      <div class="mood-shine"></div>
      <span class="mood-icon">${mood.icon}</span>
      <span class="mood-label">${mood.label}</span>
    `;
    card.addEventListener('mouseenter', () => {
      card.style.boxShadow = `0 16px 60px ${mood.glow}, 0 0 40px ${mood.glow}`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.boxShadow = '';
    });
    card.addEventListener('click', () => selectMood(mood));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectMood(mood);
      }
    });
    grid.appendChild(card);
  });
}

    const angle = Math.random() * 360, dist = 60 + Math.random() * 220;
    p.style.cssText = `
      left: calc(50% + ${Math.cos(angle * Math.PI/180) * (dist * .3)}px);
      top: calc(50% + ${Math.sin(angle * Math.PI/180) * (dist * .3)}px);
      --tx: ${Math.cos(angle * Math.PI/180) * dist}px;
      --ty: ${Math.sin(angle * Math.PI/180) * dist}px;
      animation-delay: ${Math.random() * .5}s;
      background: ${Math.random() > .5 ? '#f5c518' : '#00d4ff'};
      box-shadow: 0 0 8px ${Math.random() > .5 ? '#f5c518' : '#00d4ff'};
    `;
    overlay.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }

  setTimeout(() => {
    cb();
    setTimeout(() => overlay.classList.remove('active'), 500);
  }, 750);
}

// ================================================================
// SELECT MOOD (ENTRY FROM GRID)
// ================================================================
function selectMood(mood) {
  playFlute();
  currentMood = mood;
  // Get next message from shuffle-bag so first message also counts as seen
  const { msg, idx } = getNextMoodMessage(mood);
  currentMsgIdx = idx;

  doTransition(() => {
    document.getElementById('homePage').classList.add('hidden');
    document.getElementById('backBtn').classList.add('visible');

    const qp = document.getElementById('quotePage');
    qp.classList.remove('hidden');
    requestAnimationFrame(() => {
      qp.classList.add('visible');
    });

    renderMessage(mood, msg);
    addSparkles();
    setTimeout(playChime, 300);
  });
}

// ================================================================
// RENDER MESSAGE
// ================================================================
function renderMessage(mood, msg) {
  document.getElementById('quoteMoodBadge').textContent = `${mood.icon}  ${mood.label.toUpperCase()}`;
  document.getElementById('qIcon').textContent = mood.icon;
  document.getElementById('qParth').textContent = msg.title || msg.parth;
  document.getElementById('qText').textContent = msg.body || msg.text;
  document.getElementById('qRef').textContent = msg.verse ? `Inspired by Bhagavad Gita ${msg.verse}` : msg.ref;

  const card = document.getElementById('quoteCard');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = 'quoteIn .9s cubic-bezier(.22,.61,.36,1) both';
  card.style.boxShadow = `
    0 0 100px ${mood.glow},
    0 0 50px rgba(124,58,237,.12),
    inset 0 1px 0 rgba(255,255,255,.09)
  `;
}

// ================================================================
// RECEIVE ANOTHER MESSAGE (BUTTON CLICK HANDLER WITH FADE TRANSITION)
// ================================================================
function transitionToNextMessage() {
  if (!currentMood || isTransitioningMessage) return;
  isTransitioningMessage = true;

  const nextBtn = document.getElementById('nextMsgBtn');
  if (nextBtn) nextBtn.disabled = true;

  const dynamicEls = document.querySelectorAll('.q-dynamic-text');
  dynamicEls.forEach(el => el.classList.add('fading'));

  setTimeout(() => {
    const { msg, idx } = getNextMoodMessage(currentMood);
    currentMsgIdx = idx;

    // Mood title, emoji, and glow remain unchanged; only title, body, and verse change
    document.getElementById('qParth').textContent = msg.title || msg.parth;
    document.getElementById('qText').textContent = msg.body || msg.text;
    document.getElementById('qRef').textContent = msg.verse ? `Inspired by Bhagavad Gita ${msg.verse}` : msg.ref;

    addSparkles();
    playChime();

    dynamicEls.forEach(el => el.classList.remove('fading'));

    setTimeout(() => {
      isTransitioningMessage = false;
      if (nextBtn) nextBtn.disabled = false;
    }, 320);
  }, 300);
}

// ================================================================
// SPARKLES
// ================================================================
function addSparkles() {
  const card = document.getElementById('quoteCard');
  if (!card) return;
  card.querySelectorAll('.sparkle').forEach(s => s.remove());
  for (let i = 0; i < 16; i++) {
    const sp = document.createElement('div');
    sp.className = 'sparkle';
    const sz = 2 + Math.random() * 5;
    sp.style.cssText = `
      left:${6+Math.random()*88}%;top:${6+Math.random()*88}%;
      width:${sz}px;height:${sz}px;
      --ss:${1.8+Math.random()*3.5}s;animation-delay:${Math.random()*3.5}s;
    `;
    card.appendChild(sp);
  }
}

document.getElementById('muteBtn').addEventListener('click', () => {
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔕' : '🔔';
  if (!muted) playChime();
});

// ================================================================
// LANDING PAGE
// ================================================================
function buildLandingDust() {
  const lp = document.getElementById('landingPage');
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'land-dust';
    const sz = Math.random() * 3 + 1;
    const dx = (Math.random() - .5) * 80;
    d.style.cssText = `
      left:${Math.random()*100}%;bottom:${Math.random()*40}%;
      width:${sz}px;height:${sz}px;
      --dr:${8+Math.random()*16}s;--dx:${dx}px;
      animation-delay:${Math.random()*12}s;
      opacity:0;
    `;
    lp.appendChild(d);
  }
}

function showLanding() {
  const lp = document.getElementById('landingPage');
  lp.style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('backBtn').classList.remove('visible');
}

function enterApp() {
  playChime();
  doTransition(() => {
    document.getElementById('landingPage').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('homePage').classList.remove('hidden');
    requestAnimationFrame(() => document.getElementById('homePage').classList.add('visible'));
  });
}

document.getElementById('btnYes').addEventListener('click', enterApp);

// Back button: returns to HOME page (emotion grid)
document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('quotePage').classList.add('hidden');
  document.getElementById('quotePage').classList.remove('visible');
  document.getElementById('backBtn').classList.remove('visible');

  const hp = document.getElementById('homePage');
  hp.classList.remove('hidden');
  requestAnimationFrame(() => hp.classList.add('visible'));
  playChime();
});

// Attach Receive Another Message button click listener
const nextBtn = document.getElementById('nextMsgBtn');
if (nextBtn) {
  nextBtn.addEventListener('click', transitionToNextMessage);
}

// ================================================================
// INIT
// ================================================================
buildUniverse();
buildMoodGrid();
buildLandingDust();

// Start on landing page — hide app
document.getElementById('app').style.display = 'none';

</script>
</body>
</html>
